services:
  db:
    image: postgres:18.3-alpine3.23
    shm_size: 128mb
    ports:
      - "127.0.0.1:${POSTGRES_DOCKER_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - db-data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: 10m

  db-viewer:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@m.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - 82:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: 10m

volumes:
  db-data:
  pgadmin-data:
