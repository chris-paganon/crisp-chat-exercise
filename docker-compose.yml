services:
  db:
    image: postgres:18.3-alpine3.23
    shm_size: 128mb
    ports:
      - "127.0.0.1:${POSTGRES_DOCKER_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - db-data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: 10m

  db-viewer:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@m.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - 82:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: 10m

  turn:
    image: coturn/coturn:4.18.0-alpine
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${NUXT_TURN_SECRET:-local-turn-secret}
      - --realm=${TURN_REALM:-localhost}
      # Same-machine testing only; production must not allow loopback peers.
      - --listening-ip=127.0.0.1
      - --relay-ip=127.0.0.1
      - --allow-loopback-peers
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-tls
      - --no-tcp-relay
      - --no-cli
      - --no-multicast-peers
    logging:
      driver: json-file
      options:
        max-size: 10m

volumes:
  db-data:
  pgadmin-data:
