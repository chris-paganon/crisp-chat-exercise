    - migrate
environments:
    staging:
        host: nuxt-betterauth-staging.dockiy.com
        compose_file: docker-compose.dockiy.yml
        secrets_file: .enc.staging.env
    production:
        host: nuxt-betterauth.dockiy.com
        compose_file: docker-compose.dockiy.yml
        secrets_file: .enc.production.env
hooks:
