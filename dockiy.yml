name: crisp-chat-home

images:
    - app
    - migrate

environments:
    staging:
        host: crisp-staging.chrispaganon.com
        compose_file: docker-compose.dockiy.yml
        secrets_file: .enc.staging.env
    production:
        host: crisp.chrispaganon.com
        compose_file: docker-compose.dockiy.yml
        secrets_file: .enc.production.env

hooks:
    build: scripts/build.sh
    pre_start: scripts/pre-start.sh
    start: scripts/start.sh
    healthcheck: scripts/healthcheck.sh
